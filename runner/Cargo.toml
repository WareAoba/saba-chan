[package]
name = "saba-runner"
version = "0.1.1"
edition = "2021"
authors = ["WareAoba"]
description = "Keeps one game server's console alive across daemon restarts"
repository = "https://github.com/WareAoba/saba-chan"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "saba-runner"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
