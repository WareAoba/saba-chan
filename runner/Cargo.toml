[package]
name = "saba-runner"
version = "0.1.11"
edition = "2021"
authors = ["WareAoba"]
description = "Keeps one game server's console alive across daemon restarts"
repository = "https://github.com/WareAoba/saba-chan"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "saba-runner"
path = "src/main.rs"
required-features = ["bin"]

# 데몬은 프로토콜(lib)만 쓴다: `default-features = false`
[features]
default = ["bin"]
bin = ["dep:portable-pty", "dep:unicode-width", "dep:windows-sys", "dep:regex"]

[build-dependencies]
# exe 아이콘·버전 정보 (Windows에서만 동작)
embed-resource = "3"

[dependencies]
saba-atomic-file = { path = "../atomic-file" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# --console pty: Windows ConPTY / unix pty
portable-pty = { version = "0.9", optional = true }
# 의사 콘솔 줄을 화면 모양으로 옮길 때 넓은 글자(한자·한글)는 두 칸 (`screen.rs`)
unicode-width = { version = "0.2", optional = true }
# --line-start: 데몬(module.toml 검증)과 같은 정규식 문법
regex = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
# Job Object: 러너가 끝나면(강제 종료 포함) 서버 프로세스 트리도 끝난다. 메모리 상한과 그 알림(완료 포트)
windows-sys = { version = "0.59", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }
