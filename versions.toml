# 사바쨩 버전의 원천. 버전을 올릴 때는 이 파일만 고친다.
#
#   python scripts/versions.py sync    # 아래 files 에 버전을 써 넣는다 (Cargo.lock 포함)
#   python scripts/versions.py check   # 어긋난 파일이 있으면 실패 (CI)
#   python scripts/versions.py manifest --assets <dir> --base-url <R2_PUBLIC_BASE> --platform <p>
#                                       # 릴레이에 올릴 릴리즈 manifest(서명 전)를 만든다
#   python scripts/versions.py registration --signed <signed.json>
#                                       # 릴레이 POST /admin/releases 본문을 만든다
#
# 컴포넌트 키는 업데이터·릴레이 manifest 키와 같다
# (saba-core, cli, gui, updater, installer, locales, module-<이름>, ext-<이름>).
# 새 컴포넌트는 [components.<키>] 하나만 추가하면 된다. files 가 없으면 버전만 기록한다.
# asset 은 릴리즈 zip 이름({platform} 치환), install_dir 은 설치 루트 기준 폴더.
# exes 는 이 컴포넌트로 빌드·서명하는 Windows 실행 파일 (build-windows.yml, versions.py signing).
# R2 경로는 releases/<release version>/<asset> (운영 0.1.1과 같은 규칙).

[release]
version = "0.1.12-beta.1"
channel = "beta"

[components.saba-core]
version = "0.1.12-beta.1"
exes = ["saba-core.exe", "saba-runner.exe"]
asset = "saba-core-{platform}.zip"
install_dir = "."
# 빠지면 앱이 돌지 않는다: 패키징이 실패하고 설치기가 설치하지 않는다
required = true
# saba-runner는 saba-core zip에 같이 들어가므로 버전도 같이 간다
files = ["Cargo.toml", "runner/Cargo.toml"]

[components.cli]
version = "0.1.12-beta.1"
exes = ["saba-chan-cli.exe"]
asset = "saba-chan-cli-{platform}.zip"
install_dir = "."
files = ["saba-chan-cli/Cargo.toml"]

[components.gui]
version = "0.1.12-beta.1"
exes = ["saba-chan-gui.exe"]
asset = "saba-chan-gui-{platform}.zip"
install_dir = "."
required = true
# 데스크톱 설치에만 든다 (헤드리스 설치·업데이트는 받지 않는다). 표시가 없는 컴포넌트는 모든 구성에 든다
profiles = ["desktop"]
files = [
    "saba-chan-gui/package.json",
    "saba-chan-gui/package-lock.json",
    "saba-chan-gui/src-tauri/Cargo.toml",
    "saba-chan-gui/src-tauri/tauri.conf.json",
]

[components.updater]
version = "0.1.12-beta.1"
exes = ["saba-chan-updater.exe"]
asset = "saba-chan-updater-{platform}.zip"
install_dir = "."
required = true
files = [
    "updater/Cargo.toml",
    "updater/gui/src-tauri/Cargo.toml",
    "updater/gui/src-tauri/tauri.conf.json",
]

[components.installer]
version = "0.1.12-beta.1"
exes = ["saba-chan-installer.exe"]
asset = "saba-chan-installer.exe"
install_dir = "."
# asset 이름에 {platform}이 없는 것 중 이 플랫폼에만 싣는 것 (없으면 모든 플랫폼의 manifest에 싣는다)
platforms = ["windows-x64"]
files = [
    "installer/gui/src-tauri/Cargo.toml",
    "installer/core/Cargo.toml",
    "installer/gui/src-tauri/tauri.conf.json",
]

[components.locales]
version = "0.1.12-beta.1"
asset = "locales.zip"
install_dir = "locales"

# 모듈·익스텐션은 별도 저장소라 files 대신 릴리즈 때 그 저장소의 module.toml /
# manifest.json 버전을 읽어 여기에 채운다(U9d 릴리즈 워크플로).
