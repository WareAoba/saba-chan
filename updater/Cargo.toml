[package]
name = "saba-chan-updater-lib"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Update/installer logic library for Saba-chan"

[dependencies]
anyhow = "1"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
zip = "0.6"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
base64 = "0.21"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3.8"
getrandom = "0.2"

[[example]]
name = "gen_ed25519_keypair"
path = "examples/gen_ed25519_keypair.rs"

[[example]]
name = "sign_manifest"
path = "examples/sign_manifest.rs"
