[package]
name = "saba-chan-updater-lib"
version = "0.1.11"
edition = "2021"
authors = ["WareAoba"]
description = "Update/installer logic library for Saba-chan"

[dependencies]
anyhow = "1"
saba-atomic-file = { path = "../atomic-file" }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "system-proxy", "stream", "query"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tracing = "0.1"
toml = "1.0"
uuid = { version = "1.0", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate", "time"] }
tar = "0.4"
flate2 = "1"
sha2 = "0.11"
ring = "0.17"
base64 = "0.23"
thiserror = "2"
sys-locale = "0.3"

[features]
# 테스트 전용: 데이터 경로를 프로세스별 임시 폴더로 돌린다 (constants::resolve_data_dir)
test-isolation = []
# 개발용 모의 릴레이의 고정 키를 믿는다. 릴리즈 빌드에는 켜지 않는다
mock-relay = []

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# window_icon: 창 아이콘을 exe 리소스에서 DPI에 맞게 읽는다
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.8"
proptest = "1"
