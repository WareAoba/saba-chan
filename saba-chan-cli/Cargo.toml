[package]
name = "saba-chan-cli"
version = "0.1.10"
edition = "2021"
authors = ["WareAoba"]
description = "Command-line interface for the Saba-chan daemon"
repository = "https://github.com/WareAoba/saba-chan"
license = "MIT"
keywords = ["cli", "server-management", "game-server"]

[[bin]]
name = "saba-chan-cli"
path = "src/main.rs"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "system-proxy"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
console = "0.16"
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
indicatif = "0.18"
comfy-table = { version = "7", features = ["custom_styling"] }
rustyline = "18"
shlex = "1.3"
sys-locale = "0.3"
saba-chan-updater-lib = { path = "../updater" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
saba-chan-installer-core = { path = "../installer/core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }
winreg = "0.52"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
