[package]
name = "saba-chan-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "CLI client for Saba-chan Core Daemon"
keywords = ["cli", "server-management", "game-server"]

[[bin]]
name = "saba-chan-cli"
path = "src/main.rs"

[lib]
name = "saba_chan_cli"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
anyhow = "1.0"
ratatui = "0.28"
crossterm = "0.28"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
rustyline = "14"
shell-words = "1"
saba-chan-updater-lib = { path = "../updater" }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
saba-core = { path = ".." }
