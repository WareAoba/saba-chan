[package]
name = "saba-chan-cli"
version = "0.1.8"
edition = "2021"
authors = ["WareAoba"]
description = "Command-line interface for the Saba-chan daemon"
repository = "https://github.com/WareAoba/saba-chan"
license = "MIT"
keywords = ["cli", "server-management", "game-server"]

[[bin]]
name = "saba-chan-cli"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
console = "0.15"
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
indicatif = "0.17"
comfy-table = { version = "7", features = ["custom_styling"] }
rustyline = "14"
shlex = "1.3"
sys-locale = "0.3"
saba-chan-updater-lib = { path = "../updater" }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
saba-chan-installer-core = { path = "../installer/core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
