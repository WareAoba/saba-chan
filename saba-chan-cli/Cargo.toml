[package]
name = "saba-chan-cli"
version = "0.1.14"
edition = "2024"
authors = ["WareAoba"]
description = "Command-line interface for the Saba-chan daemon"
repository = "https://github.com/WareAoba/saba-chan"
license = "MIT"
keywords = ["cli", "server-management", "game-server"]

[lints]
workspace = true

[[bin]]
name = "saba-chan-cli"
path = "src/main.rs"

# 짧은 명령 이름 `saba-chan` (Windows 설치의 `bin\saba-chan.exe`). 같은 설치의 saba-chan-cli를 실행한다
[[bin]]
name = "saba-chan"
path = "src/launcher.rs"

[dependencies]
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "system-proxy"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
console = "0.16"
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
indicatif = "0.18"
comfy-table = { version = "8", features = ["custom_styling"] }
rustyline = "19"
shlex = "2.0"
sys-locale = "0.3"
saba-chan-updater-lib = { path = "../updater" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
saba-chan-installer-core = { path = "../installer/core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# 로컬 MCP 서버 (`mcp`): 공식 Rust SDK, stdio만
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }
# Codex 설정 파일(`agent link`)을 주석·다른 칸을 지키며 고친다
toml_edit = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
winreg = "0.55"

[features]
# 개발용: `install`이 모의 릴레이(`SABA_RELAY_URL`, scripts/mock-release-server.js)에서 받는다. 릴리즈 빌드에는 켜지 않는다
mock-relay = ["saba-chan-installer-core/mock-relay"]

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
