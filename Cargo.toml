[package]
name = "saba-core"
version = "0.1.5"
edition = "2021"
authors = ["WareAoba"]
description = "Modular game server management platform"
repository = "https://github.com/WareAoba/saba-chan"
license = "MIT"
keywords = ["game-server", "palworld", "minecraft", "management"]

[workspace]
members = [".", "runner", "updater", "updater/gui/src-tauri", "installer/gui/src-tauri", "saba-chan-cli"]

[[bin]]
name = "saba-core"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
anyhow = "1.0"
toml = "0.5"
serde_ignored = "0.1"
schemars = "0.8"
axum = "0.7"
zip = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
glob = "0.3"
regex = "1"
reqwest = { version = "0.11", features = ["json"] }
byteorder = "1.5"
ureq = { version = "2.9", default-features = true, features = ["json", "tls"] }
base64 = "0.21"
sysinfo = "0.30"
socket2 = "0.5"
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
saba-chan-updater-lib = { path = "updater" }
saba-runner = { path = "runner", default-features = false }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "winnt", "handleapi", "pdh", "libloaderapi", "userenv", "aclapi", "accctrl", "securitybaseapi", "jobapi2", "namedpipeapi", "synchapi", "minwinbase", "winbase", "fileapi"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal"] }

[dependencies.tower]
version = "0.4"
# 액션 카탈로그가 데몬 라우터를 안에서 부른다 (`ServiceExt::oneshot`)
features = ["util"]

[dependencies.tower-http]
version = "0.5"
features = ["trace"]

[dependencies.hyper]
version = "1"
features = ["full"]
[features]
# `cargo build --features mock-relay`: scripts/mock-release-server.js로 업데이트 흐름을 시험하는 개발 빌드
mock-relay = ["saba-chan-updater-lib/mock-relay"]

[dev-dependencies]
regex-lite = "0.1"
saba-chan-updater-lib = { path = "updater", features = ["test-isolation"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true