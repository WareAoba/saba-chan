[package]
name = "saba-core"
version = "0.1.12-beta.1"
edition = "2021"
authors = ["WareAoba"]
description = "Modular game server management platform"
repository = "https://github.com/WareAoba/saba-chan"
license = "MIT"
keywords = ["game-server", "palworld", "minecraft", "management"]

[workspace]
members = [".", "atomic-file", "runner", "updater", "updater/gui/src-tauri", "installer/gui/src-tauri", "installer/core", "saba-chan-cli", "saba-chan-gui/src-tauri"]

[[bin]]
name = "saba-core"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sys-locale = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
anyhow = "1.0"
toml = "0.9"
serde_ignored = "0.1"
schemars = "0.8"
axum = "0.8"
# 사용자가 직접 넣는 모듈·익스텐션 zip은 7-Zip 등에서 bzip2·zstd로 묶었을 수 있다 (암호 zip만 뺀다)
zip = { version = "9", default-features = false, features = ["deflate", "bzip2", "zstd", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
glob = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "system-proxy", "blocking"] }
base64 = "0.22"
sysinfo = "0.38"
socket2 = "0.5"
tokio-util = "0.7"
# 사바쨩 웹: 릴레이 웹소켓 클라이언트 (`crate::remote`). reqwest와 같은 native-tls
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false }
hmac = "0.12"
sha2 = "0.10"
# 증분 백업의 내용 저장소 (MK16). zip이 이미 쓰는 판
flate2 = "1"
hex = "0.4"
# 원격 데몬 (D1, `crate::remote_daemon`): 자체 서명 인증서 + 지문 고정 TLS. 암호 구현은 ring 하나
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
# 포트포워딩 확인 (`crate::port_check`): 공유기가 아는 바깥 주소(UPnP)로 CGNAT를 알아본다. hyper·tokio는 위와 같은 판
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }
saba-chan-updater-lib = { path = "updater" }
saba-atomic-file = { path = "atomic-file" }
saba-runner = { path = "runner", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Performance",
    "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_SystemServices", "Win32_System_Threading",
] }
winreg = "0.52"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[dependencies.tower]
version = "0.5"
# 액션 카탈로그가 데몬 라우터를 안에서 부른다 (`ServiceExt::oneshot`)
features = ["util"]


[features]
# `cargo build --features mock-relay`: scripts/mock-release-server.js로 업데이트 흐름을 시험하는 개발 빌드
mock-relay = ["saba-chan-updater-lib/mock-relay"]

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
proptest = "1"
saba-chan-updater-lib = { path = "updater", features = ["test-isolation"] }

[profile.release]
# 크기 우선. 데몬 일은 대부분 프로세스·네트워크 대기다 (리눅스 측정: 데몬 -23%, CLI -25%)
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# 백업 압축·내려받기 해시처럼 계산이 몰리는 크레이트만 속도 최적화를 남긴다
[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.ring]
opt-level = 3
