[pytest]
testpaths = .
addopts = -ra --strict-markers
markers =
    windows: Windows에서만 돈다 (Job Object 메모리 상한, AppContainer, PDH 등)
    network: 진짜 외부 다운로드가 필요하다 (Mojang, Paper, Fabric, Adoptium)
    steam: SteamCMD로 수 GB를 받는다 (Palworld, Zomboid)
    gui: Electron GUI를 띄운다
    relay_real: server-chan relay-server와 PostgreSQL이 필요하다
    mock_relay: --features mock-relay로 빌드한 데몬이 필요하다
    slow: 1분 넘게 걸린다
