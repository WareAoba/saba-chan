name: Release — Package & Manifest

# ─────────────────────────────────────────────────────────
# 릴리즈 파일 패키징 & manifest.json 자동 생성 워크플로우
#
# 부분 릴리즈 지원:
#   모든 컴포넌트를 매번 빌드할 필요 없음.
#   변경된 컴포넌트만 올리면 나머지는 이전 릴리즈에서 자동 수집.
#
# 사용법:
#   1. GitHub에서 Draft Release 생성 (태그: v0.x.x)
#   2. 변경된 컴포넌트만 빌드하여 릴리즈에 첨부:
#      - saba-core.exe / saba-core-*.zip
#      - saba-chan-cli.exe / saba-chan-cli-*.zip
#      - saba-chan-gui.exe / saba-chan-gui-*.zip
#      - saba-chan-updater.exe / saba-chan-updater-*.zip
#      - saba-chan-installer.exe / saba-chan-installer-*.zip
#      (전부 올릴 필요 없음 — 빠진 것은 이전 릴리즈에서 가져옴)
#   3. Release 발행 → 이 액션이 자동 수행:
#      a) raw exe → 표준 이름의 zip으로 리패키징
#      b) 빠진 컴포넌트 → 이전 릴리즈에서 다운로드
#      c) locales/ → locales.zip 생성 (항상 최신 소스 반영)
#      d) SHA256 해시가 포함된 manifest.json 생성
#      e) 모든 결과물을 릴리즈에 업로드
#
# 최종 릴리즈 에셋 (매 릴리즈마다 완전체 보장):
#   saba-core-windows-x64.zip
#   saba-chan-cli-windows-x64.zip
#   saba-chan-gui-windows-x64.zip
#   saba-chan-updater-windows-x64.zip
#   saba-chan-installer.exe  (zip 아님: 소개 페이지 다운로드와 업데이터의 제거기 사본 교체용)
#   saba-core-linux-x64.zip, saba-chan-cli-linux-x64.zip, saba-chan-updater-linux-x64.zip, saba-chan-gui-linux-x64.zip
#     (리눅스용. GUI zip은 데스크톱 구성만 받는다. 올릴 필요 없이 이 액션이 main 소스로 빌드한다)
#   locales.zip
#   manifest.json
#
# 트리거:
#   - published: 드래프트→발행, 또는 새 릴리즈 생성 시
#   - edited: 기존 릴리즈의 태그/에셋 수정 시 (에셋만 변경해도 재처리)
#   - workflow_dispatch: Actions 탭에서 수동 실행 (태그 입력 필요)
#
# R2 배포 (업데이터가 실제로 받는 경로):
#   패키징 뒤 같은 zip으로 manifest를 만들고(scripts/versions.py) 기존 키로 서명해
#   R2 releases/<version>/ 에 올리고 릴레이 POST /admin/releases 로 등록한다.
#   이미 R2에 있거나 릴레이에 등록된 버전이면 아무것도 덮어쓰지 않고 실패한다.
#   필요한 설정 (없으면 R2 단계는 건너뜀. 단 정식판 published 실행은 실패):
#     secrets:   UPDATER_SIGNING_KEY (64자리 hex seed), R2_ACCESS_KEY_ID,
#                R2_SECRET_ACCESS_KEY, RELAY_INTERNAL_SECRET
#     variables: R2_ENDPOINT, R2_BUCKET, R2_PUBLIC_BASE, RELAY_URL
# ─────────────────────────────────────────────────────────

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag_name:
        description: '처리할 릴리즈 태그 (예: v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

# 동일 릴리즈에 대한 동시 실행 방지 (짧은 시간에 여러 편집 시).
# 진행 중인 실행은 취소하지 않는다: R2 업로드와 릴레이 등록 사이에서 끊기면
# 다시 실행해도 "이미 R2에 있음"으로 멈춰 그 버전을 손으로 정리해야 한다
concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag_name }}
  cancel-in-progress: false

jobs:
  package-and-manifest:
    name: Package assets & generate manifest
    # 리눅스 실행 파일은 이 러너의 glibc 판을 요구한다 — 문서가 약속한 Ubuntu 22.04·Debian 12에서 돌게 22.04로 빌드한다
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    env:
      # release 이벤트와 workflow_dispatch 모두 지원
      TARGET_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}

    # bash -eo pipefail: 파이프 앞쪽 명령의 실패도 단계 실패로 친다
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-beta.1"; exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main  # 태그가 아닌 main의 최신 스크립트·소스를 사용
          fetch-depth: 0  # 릴리즈 노트가 이전 태그부터의 커밋을 읽는다

      - name: Verify release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Target tag: ${{ env.TARGET_TAG }}"
          gh release view "${{ env.TARGET_TAG }}" \
            --repo "${{ github.repository }}" \
            --json tagName,name,isDraft \
            --jq '"\(.tagName) — \(.name) (draft: \(.isDraft))"'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Download existing release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p staging
          gh release download "${{ env.TARGET_TAG }}" \
            --repo "${{ github.repository }}" \
            --dir staging \
            --skip-existing
          echo "=== Downloaded assets ==="
          ls -la staging/
          # 받다 끊긴 에셋을 이전 릴리즈 것으로 채워 서명하지 않게, 릴리즈의 에셋이 모두 왔는지 본다
          gh release view "$TARGET_TAG" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[] | "\(.name)\t\(.size)"' > expected-assets.tsv
          while IFS=$'\t' read -r name size; do
            actual=$(stat -c %s "staging/$name" 2>/dev/null || echo missing)
            if [ "$actual" != "$size" ]; then
              echo "::error::Release asset $name did not download completely ($actual of $size bytes)"; exit 1
            fi
          done < expected-assets.tsv

      - name: Package & generate manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.TARGET_TAG }}
          RELEASE_ID: ${{ github.event.release.id || '' }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: python .github/scripts/package-release.py

      # ── R2 배포 ─────────────────────────────────────────
      - name: Check R2 publish settings
        id: r2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ACTION: ${{ github.event.action }}
          HAS_KEY: ${{ secrets.UPDATER_SIGNING_KEY != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.RELAY_INTERNAL_SECRET != '' }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
          HAS_VARS: ${{ vars.R2_ENDPOINT != '' && vars.R2_BUCKET != '' && vars.R2_PUBLIC_BASE != '' && vars.RELAY_URL != '' }}
        run: |
          # 수동 실행에는 release 이벤트가 없으므로 GitHub의 prerelease 표시를 직접 읽는다
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PRERELEASE=$(gh release view "$TARGET_TAG" --repo "${{ github.repository }}" \
              --json isPrerelease -q .isPrerelease)
          fi
          if [ "$HAS_KEY" = "true" ] && [ "$HAS_VARS" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_ACTION" = "published" ] && [ "$PRERELEASE" != "true" ]; then
            # 정식판 발행이 R2·릴레이 없이 성공으로 끝나면 업데이터가 새 버전을 받지 못한다
            echo "::error::R2 secrets/variables are not set; a stable release cannot skip R2 publish"
            exit 1
          else
            echo "::warning::R2 secrets/variables are not set; skipping R2 publish"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('versions.toml','rb'))['release']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${TARGET_TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TARGET_TAG does not match versions.toml release $VERSION"
            exit 1
          fi
          # GitHub에서 prerelease로 표시한 릴리즈가 stable 채널로 나가지 않게 한다
          CHANNEL=$(python -c "import tomllib;print(tomllib.load(open('versions.toml','rb'))['release'].get('channel','stable'))")
          if [ "$PRERELEASE" = "true" ] && [ "$CHANNEL" = "stable" ]; then
            echo "::error::Release is marked prerelease but versions.toml channel is stable"
            exit 1
          fi

      - name: Refuse to overwrite an existing release
        id: guard
        if: steps.r2.outputs.enabled == 'true'
        env:
          RELEASE_ACTION: ${{ github.event.action }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ steps.r2.outputs.version }}
        run: |
          # 확인하지 못하면 "없다"로 치지 않고 멈춘다 (덮어쓰기 방지)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Saba-Client: 1' \
            "${{ vars.RELAY_URL }}/v1/updates/manifest/$VERSION")
          case "$code" in
            404) ;;
            200)
              # 발행 뒤 릴리즈를 고친 것(edited)이면 R2·릴레이는 그대로 두고 GitHub 에셋만 다시 만든다
              if [ "$RELEASE_ACTION" = "edited" ]; then
                echo "::notice::Relay already has $VERSION; release edited, skipping R2 publish"
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::Relay already has $VERSION; bump versions.toml"; exit 1 ;;
            *) echo "::error::Relay check for $VERSION returned HTTP $code; cannot confirm it is new"; exit 1 ;;
          esac
          count=$(aws s3api list-objects-v2 --bucket "${{ vars.R2_BUCKET }}" \
            --prefix "releases/$VERSION/" --max-keys 1 --query 'KeyCount' --output text \
            --endpoint-url "${{ vars.R2_ENDPOINT }}")
          if [ "$count" != "0" ]; then
            echo "::error::R2 releases/$VERSION/ already has objects (KeyCount=$count)"
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # 모듈·익스텐션도 같은 릴리즈에 싣는다 (U9e). 둘 다 공개 저장소, main 기준
      - name: Checkout modules
        if: steps.guard.outputs.publish == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: WareAoba/saba-chan-modules
          ref: main
          path: addons/modules

      - name: Checkout extensions
        if: steps.guard.outputs.publish == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: WareAoba/saba-chan-extensions
          ref: main
          path: addons/extensions

      - name: Install Rust toolchain
        if: steps.guard.outputs.publish != 'false'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # 리눅스 GUI (데스크톱 구성): Tauri 빌드에 GTK·WebKitGTK 개발 패키지와 프런트엔드 번들이 든다
      - name: Install Linux GUI build dependencies
        if: steps.guard.outputs.publish != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        if: steps.guard.outputs.publish != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build GUI frontend
        if: steps.guard.outputs.publish != 'false'
        working-directory: saba-chan-gui
        run: |
          npm ci
          npm run build

      # 리눅스 설치 (D3c): 이 소스(main)로 데몬·러너·CLI·창 없는 업데이터·GUI를 빌드해
      # linux-x64 zip으로 싣는다. manifest의 platforms.linux-x64가 이 파일들을 가리킨다.
      # 업데이터는 창 없이 빌드한다: 화면 없는 서버에도 같은 파일이 가고, 데스크톱에서는 적용한 뒤 GUI를 다시 띄운다
      - name: Build Linux assets
        if: steps.guard.outputs.publish != 'false'
        run: |
          cargo build --release --locked -p saba-core -p saba-runner -p saba-chan-cli -p saba-chan-gui --bins
          cargo build --release --locked -p saba-chan-updater --no-default-features
          # Debian 12(glibc 2.36)보다 새 glibc 기호를 요구하면 멈춘다
          for b in saba-core saba-runner saba-chan-cli saba-chan-updater saba-chan-gui; do
            need=$(objdump -T "target/release/$b" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "$b needs glibc $need"
            if [ "$(printf '%s\n' "$need" 2.35 | sort -V | tail -1)" != "2.35" ]; then
              echo "::error::$b requires glibc $need (> 2.35)"; exit 1
            fi
          done
          python .github/scripts/package-linux.py --bin target/release --out output

      # 선언하지 않은 능력을 쓰는 모듈·익스텐션은 싣지 않는다 (M12)
      - name: Audit modules and extensions
        if: steps.guard.outputs.publish == 'true'
        run: |
          mods=$(for d in addons/modules/*/; do [ -f "$d/module.toml" ] && echo "$d"; done)
          exts=$(for d in addons/extensions/*/; do [ -f "$d/manifest.json" ] && echo "$d"; done)
          cargo build --quiet --bin saba-core
          ./target/debug/saba-core module audit $mods
          ./target/debug/saba-core extension audit $exts

      # 서명 도구는 키 없이 먼저 빌드한다: 의존성 빌드 스크립트가 키를 환경에서 읽지 못하게
      - name: Build signing tool
        if: steps.guard.outputs.publish == 'true'
        run: cargo build --quiet -p saba-chan-updater-lib --example release_signing

      - name: Build and sign manifest
        if: steps.guard.outputs.publish == 'true'
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: |
          # 지난 릴리즈(모든 채널 중 최신)의 manifest: 바뀐 모듈·익스텐션이 같은 버전으로 다시 나가지 않게 대조한다.
          # 업데이터·데몬은 버전이 오른 것만 받는다. 확인하지 못하면 멈춘다
          prev_url=$(curl -fsS -H 'X-Saba-Client: 1' \
            "${{ vars.RELAY_URL }}/v1/updates/check?channel=beta&platform=windows-x64&current=0.0.0&client_id=release-workflow" \
            | python -c "import json,sys;print(json.load(sys.stdin).get('latest',{}).get('manifestUrl',''))")
          previous=()
          if [ -n "$prev_url" ]; then
            curl -fsS -H 'X-Saba-Client: 1' "$prev_url" > previous-manifest.json
            previous=(--previous previous-manifest.json)
          fi
          python scripts/versions.py manifest --assets output \
            --base-url "${{ vars.R2_PUBLIC_BASE }}" --platform windows-x64 --also-platform linux-x64 \
            --modules-repo addons/modules --extensions-repo addons/extensions \
            --addons-ref "$(git -C addons/modules rev-parse HEAD)" \
            "${previous[@]}" \
            --out release-manifest.unsigned.json
          # 번들된 공개키로 검증까지 통과해야 출력된다
          ./target/debug/examples/release_signing \
            sign release-manifest.unsigned.json saba-updater-v1 > release-manifest.signed.json
          python scripts/versions.py registration --signed release-manifest.signed.json \
            --out release-registration.json
          cat release-manifest.unsigned.json

      - name: Upload assets to R2
        if: steps.guard.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          python - <<'PY' > r2-uploads.txt
          import json
          m = json.load(open("release-registration.json"))
          # 모듈·locales는 플랫폼마다 한 줄씩 등록되지만 같은 파일이다: 한 번만 올린다
          for filename, key in sorted({(a["filename"], a["r2Key"]) for a in m["assets"]}):
              print(filename, key)
          PY
          while read -r file key; do
            echo "  $file -> $key"
            aws s3 cp "output/$file" "s3://${{ vars.R2_BUCKET }}/$key" \
              --endpoint-url "${{ vars.R2_ENDPOINT }}" --no-progress
          done < r2-uploads.txt

      - name: Register release with relay
        if: steps.guard.outputs.publish == 'true'
        env:
          RELAY_INTERNAL_SECRET: ${{ secrets.RELAY_INTERNAL_SECRET }}
        run: |
          curl -fsS -X POST "${{ vars.RELAY_URL }}/admin/releases" \
            -H "x-internal-secret: $RELAY_INTERNAL_SECRET" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @release-registration.json
          echo
          curl -fsS -H 'X-Saba-Client: 1' \
            "${{ vars.RELAY_URL }}/v1/updates/manifest/${{ steps.r2.outputs.version }}" > /dev/null
          echo "✓ Registered ${{ steps.r2.outputs.version }}"

      # 릴레이에 이미 있는 버전(edited 재실행)이면 GitHub 에셋도 그대로 둔다:
      # 바꾸면 같은 버전 번호에 R2와 다른 파일이 붙고, 다음 부분 릴리즈가 그 파일을 가져간다
      - name: Upload packaged assets to release
        if: steps.guard.outputs.publish != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Uploading to release ==="
          for f in output/*; do
            echo "  Uploading: $(basename $f)"
            gh release upload "${{ env.TARGET_TAG }}" \
              "$f" \
              --repo "${{ github.repository }}" \
              --clobber
          done
          echo "✓ All assets uploaded"

      - name: Clean up original raw assets
        if: steps.guard.outputs.publish != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Cleaning up raw assets ==="
          # output/ 에 있는 파일 이름 목록 = 유지할 에셋
          KEEP_FILES=$(ls output/ | sort)
          # 릴리즈의 현재 에셋 목록
          ALL_ASSETS=$(gh release view "${{ env.TARGET_TAG }}" \
            --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' | sort)
          # output/에 없는 에셋 삭제
          for asset in $ALL_ASSETS; do
            if ! echo "$KEEP_FILES" | grep -qx "$asset"; then
              echo "  Deleting: $asset"
              gh release delete-asset "${{ env.TARGET_TAG }}" \
                "$asset" \
                --repo "${{ github.repository }}" \
                --yes
            fi
          done
          echo "✓ Cleanup complete"

      # 정리 단계가 output/에 없는 에셋을 지우므로 맨 마지막에 붙인다.
      # edited 재실행(publish=false)이면 이미 붙은 노트를 바꾸지 않는다
      - name: Attach release notes
        if: steps.guard.outputs.publish != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p notes
          python scripts/changelog.py --until "${{ env.TARGET_TAG }}" \
            --version "${TARGET_TAG#v}" --output notes/CHANGELOG.md
          cat notes/CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"
          gh release upload "${{ env.TARGET_TAG }}" notes/CHANGELOG.md \
            --repo "${{ github.repository }}" --clobber
