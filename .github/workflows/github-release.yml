name: GitHub release

# ─────────────────────────────────────────────────────────
# 릴레이에 등록된 릴리스를 GitHub Release로도 올린다(태그 v<version>).
#
# publish.yml이 등록을 마친 뒤 부른다. 지난 릴리스는 Actions 탭에서 main으로 직접 실행한다
# (version, 그 버전을 빌드한 커밋 sha).
# 파일은 릴레이의 서명된 manifest가 가리키는 R2 파일을 받아 sha256·크기를 대조한 것만 올린다
# (.github/scripts/github-release.py). R2·릴레이는 읽기만 하므로 secret을 쓰지 않는다
# (environment `release`의 변수 RELAY_URL만 읽는다).
# 덮어쓰기 금지: 그 태그나 Release가 이미 있으면 멈춘다.
# 채널이 stable이 아니면 사전 릴리스(pre-release)로 올린다. 채널은 릴레이에 등록한 채널(`channel`)이고,
# 주지 않으면 서명된 manifest의 채널이다 (지난 릴리스). publish.yml은 늘 beta로 등록하므로 beta를 넘기고,
# 정식 승격 때 promote-release.yml이 사전 릴리스 표시를 걷는다.
# ─────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      sha:
        type: string
        required: true
      channel:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: '올릴 버전 (릴레이에 등록된 것, 예: 0.1.11)'
        type: string
        required: true
      sha:
        description: '그 버전을 빌드한 saba-chan 커밋 (40자리)'
        type: string
        required: true
      channel:
        description: '릴레이에 등록된 채널 (비우면 서명된 manifest의 채널)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-22.04
    # RELAY_URL 변수만 쓴다. 이 작업은 secret을 읽지 않는다
    environment: release
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
      REGISTERED_CHANNEL: ${{ inputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main (got $GITHUB_REF)"; exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-22.04의 python3는 3.10이라 tomllib이 없다
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # 태그가 그 버전의 소스를 가리키는지 본다: 커밋의 versions.toml [release].version이 같아야 한다
      - name: Check inputs
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version $VERSION"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 lowercase hex"; exit 1; }
          git fetch --quiet --depth=1 origin "$SHA"
          got=$(git show "$SHA:versions.toml" | python -c "import sys,tomllib;print(tomllib.loads(sys.stdin.read())['release']['version'])")
          if [ "$got" != "$VERSION" ]; then
            echo "::error::$SHA builds $got, not $VERSION"; exit 1
          fi
          if [ ! -f "release-notes/$VERSION.json" ]; then
            echo "::error::release-notes/$VERSION.json is missing on main"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists"; exit 1
          fi

      - name: Download from R2 and verify
        run: |
          python .github/scripts/github-release.py --relay "${{ vars.RELAY_URL }}" --version "$VERSION" \
            --notes "release-notes/$VERSION.json" --out gh-release --notes-out gh-release-notes.md
          ls -l gh-release

      - name: Create release
        run: |
          channel="$REGISTERED_CHANNEL"
          if [ -z "$channel" ]; then
            channel=$(python -c "import json;print(json.load(open('gh-release/release-manifest.json'))['manifest'].get('channel','stable'))")
          fi
          flags=()
          if [ "$channel" != "stable" ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" gh-release/* \
            --target "$SHA" --title "사바쨩 $VERSION" --notes-file gh-release-notes.md "${flags[@]}"
          echo "### GitHub release v$VERSION ($channel) at \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
