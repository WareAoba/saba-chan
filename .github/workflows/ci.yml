# ═══════════════════════════════════════════════════════════
# 통합 CI — Lint · Test · Build
# ═══════════════════════════════════════════════════════════
#
# 구조:
#   1) rust      — Clippy + build + test  (Windows / Ubuntu)
#   2) js-tests  — GUI 화면 (Vitest + build), 업데이터/설치기 스크립트 문법
#   3) e2e       — Python E2E (tests/e2e/run-cloud.sh, 외부망·Steam·느린 시험 제외, Ubuntu)
#   4) build     — Release 빌드 + 아티팩트 업로드 (main push / tag 시)
#
# release.yml:   릴리즈 패키징 & manifest 생성
# ═══════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────
  # 1. Rust — Clippy + Build + Test
  # ─────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Versions match versions.toml
        if: runner.os == 'Linux'
        run: python3 scripts/versions.py check

      - name: Release packaging tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create test fixture module
        shell: bash
        run: |
          mkdir -p modules/test-module
          cat > modules/test-module/module.toml << 'EOF'
          [module]
          name = "test-module"
          version = "0.0.1"
          description = "CI test fixture"
          author = "ci"
          game_name = "TestGame"
          display_name = "Test Module"
          entry = "lifecycle.py"
          EOF
          # Strip leading whitespace from heredoc (YAML indentation artifact)
          sed -i 's/^[[:space:]]*//' modules/test-module/module.toml
          cat > modules/test-module/lifecycle.py << 'EOF'
          # minimal test lifecycle
          EOF
          sed -i 's/^[[:space:]]*//' modules/test-module/lifecycle.py

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  # ─────────────────────────────────────────
  # 2. JavaScript — GUI
  # ─────────────────────────────────────────
  js-tests:
    name: JS Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: saba-chan-gui/package-lock.json

      - name: Install & Test — GUI
        working-directory: saba-chan-gui
        run: |
          npm ci
          npx vitest run
          npx vite build

      # 번들러 없이 그대로 실리는 스크립트는 문법만 확인한다
      - name: Syntax check — updater, installer
        run: node --check updater/gui/src/updater.js && node --check installer/gui/src/installer.js

  # ─────────────────────────────────────────
  # 3. E2E — 실제 데몬·CLI·러너를 띄우는 Python 시험
  # ─────────────────────────────────────────
  e2e:
    name: E2E (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 시험 샌드박스는 모듈·익스텐션 저장소를 복사해 쓴다 (harness/sandbox.py)
      - uses: actions/checkout@v4
        with:
          repository: WareAoba/saba-chan-modules
          path: .e2e-deps/saba-chan-modules
      - uses: actions/checkout@v4
        with:
          repository: WareAoba/saba-chan-extensions
          path: .e2e-deps/saba-chan-extensions

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: e2e-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: e2e-${{ runner.os }}-cargo-

      # 외부망(network)·SteamCMD(steam)·느린(slow) 시험은 뺀다. GUI 시험은 tauri-driver가 없어 건너뛴다
      - name: Run E2E
        env:
          SABA_E2E_ROOT: ${{ runner.temp }}/saba-e2e
          SABA_E2E_MODULES_REPO: ${{ github.workspace }}/.e2e-deps/saba-chan-modules
          SABA_E2E_EXTENSIONS_REPO: ${{ github.workspace }}/.e2e-deps/saba-chan-extensions
        run: bash tests/e2e/run-cloud.sh

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: ${{ runner.temp }}/saba-e2e/*.md
          if-no-files-found: ignore
