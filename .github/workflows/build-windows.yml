name: Release — Windows build & sign

# ─────────────────────────────────────────────────────────
# Windows 배포물 빌드 + 코드 서명 (SignPath Foundation)
#
# PC에서 돌리던 scripts/build-windows.ps1을 GitHub 호스트 러너로 옮긴 것이다.
# SignPath Foundation은 GitHub가 빌드했다고 확인한 아티팩트만 서명한다(origin verification).
#
# 사용법:
#   1. GitHub에서 Draft Release 생성 (태그: v<versions.toml release version>)
#   2. Actions 탭에서 이 워크플로를 main으로 실행 (tag_name 입력)
#   3. SignPath에서 서명 요청을 승인 (Foundation은 릴리스마다 사람이 승인한다)
#   4. 서명된 exe 여섯 개가 드래프트에 붙으면 Release 발행 → release.yml이 패키징·manifest·R2를 맡는다
#
# 서명 설정 (없으면 서명하지 않은 exe를 붙이고 경고만 낸다):
#   secrets:   SIGNPATH_API_TOKEN
#   variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
#   SignPath 산출물 설정: .github/signpath/artifact-configuration.xml
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '빌드해 붙일 드래프트 릴리즈 태그 (예: v0.1.11)'
        required: true
        type: string

permissions:
  contents: write  # 드래프트 릴리즈에 exe를 붙인다
  actions: read    # SignPath가 아티팩트를 받는다

concurrency:
  group: build-windows-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & sign Windows executables
    runs-on: windows-latest
    # 빌드 약 40분 + SignPath 승인 대기 최대 1시간
    timeout-minutes: 150

    env:
      TARGET_TAG: ${{ github.event.inputs.tag_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      # 서명하는 것은 리뷰를 거쳐 main에 들어간 소스뿐이다
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main (got $GITHUB_REF)"; exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # 40분 빌드 전에 붙일 곳과 버전부터 확인한다. 발행된 릴리즈의 에셋은 바꾸지 않는다
      - name: Check tag, versions and draft release
        run: |
          if ! [[ "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-beta.1"; exit 1
          fi
          python scripts/versions.py check
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('versions.toml','rb'))['release']['version'])")
          if [ "${TARGET_TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TARGET_TAG does not match versions.toml release $VERSION"; exit 1
          fi
          draft=$(gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
          if [ "$draft" != "true" ]; then
            echo "::error::$TARGET_TAG is not a draft release; create the draft first"; exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Tauri GUI가 build/를 exe에 넣으므로 cargo보다 먼저 끝나야 한다.
      # 릴리스 빌드는 캐시를 쓰지 않는다: 서명할 바이너리는 깨끗한 소스에서만 만든다
      - name: Build GUI frontend
        working-directory: saba-chan-gui
        run: |
          npm ci
          npm run build

      - name: Build Rust workspace
        run: cargo build --release --locked --workspace

      # 서명할 exe 목록은 versions.toml `[components.<키>] exes` 하나에서 읽는다.
      # 제품 이름·버전이 SignPath 산출물 설정과 versions.toml에 맞는지 서명 요청 전에 본다
      - name: Collect executables
        run: |
          python scripts/versions.py signing --collect target/release --exes dist --out signpath-parameters.txt
          ls -l dist
          cat signpath-parameters.txt

      - name: Check signing settings
        id: signpath
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          HAS_VARS: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_VARS" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            {
              echo "parameters<<SIGNPATH_EOF"
              cat signpath-parameters.txt
              echo "SIGNPATH_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SignPath secrets/variables are not set; attaching unsigned executables"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saba-chan-windows-unsigned-${{ env.TARGET_TAG }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: ${{ steps.signpath.outputs.parameters }}
          wait-for-completion: true
          # 릴리스마다 사람이 SignPath에서 승인한다
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Verify signatures
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $bad = Get-ChildItem signed -Filter *.exe | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { Write-Error "Not validly signed: $($bad.Name -join ', ')"; exit 1 }
          if ((Get-ChildItem signed -Filter *.exe).Count -ne (Get-ChildItem dist -Filter *.exe).Count) {
            Write-Error "Signed artifact does not hold every executable"; exit 1
          }
          # 서명은 버전 리소스를 바꾸지 않는다: 붙이기 전에 한 번 더 대조한다
          python scripts/versions.py signing --exes signed > $null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Attach executables to draft release
        env:
          SIGNED: ${{ steps.signpath.outputs.enabled }}
        run: |
          dir=dist
          if [ "$SIGNED" = "true" ]; then dir=signed; fi
          # 빌드·승인을 기다리는 동안 발행됐으면 붙이지 않는다 (release.yml이 이미 그 에셋으로 패키징했다)
          draft=$(gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
          if [ "$draft" != "true" ]; then
            echo "::error::$TARGET_TAG was published while building; not replacing its assets"; exit 1
          fi
          gh release upload "$TARGET_TAG" "$dir"/*.exe --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "### $TARGET_TAG Windows executables ($([ "$SIGNED" = "true" ] && echo signed || echo UNSIGNED))"
            echo
            echo "Built from \`$GITHUB_SHA\`"
            echo
            (cd "$dir" && sha256sum *.exe | sed 's/^/    /')
          } >> "$GITHUB_STEP_SUMMARY"
