name: Publish release

# ─────────────────────────────────────────────────────────
# 클라이언트 릴리스 발행: 바뀐 것만 빌드 → 패키징 → 조합 관문 → manifest 서명 → R2 업로드 → 릴레이 베타 등록
#
# 사용법: Actions 탭에서 이 워크플로를 main으로 실행한다. 버전·채널은 versions.toml [release],
# 패치노트는 release-notes/<version>.json 에서 읽는다. 등록이 끝나면 github-release.yml이
# 같은 파일로 GitHub Release(태그 v<version>, stable이 아니면 사전 릴리스)를 만든다.
#   dry_run = true 이면 빌드·패키징·관문·서명까지만 하고 R2·릴레이는 건드리지 않는다
#   (결과물은 실행의 아티팩트로 남는다).
#
# 검증된 조합 (docs 05 §3.1):
#   부분 릴리즈  prepare가 지난 릴리즈(모든 채널 중 가장 높은 판) manifest와 versions.toml을 비교한다(versions.py plan).
#                버전이 같은 컴포넌트는 빌드하지 않고 지난 manifest 항목(url·sha256·version)을 그대로 싣는다.
#                실행 파일 컴포넌트가 하나도 안 바뀌었으면 세 플랫폼 빌드를 건너뛴다.
#   조합 관문    서명 전에 그 조합(새로 빌드한 것 + 지난 릴리즈 파일)의 linux-x64 데몬·러너·CLI로 E2E를 돌린다.
#   베타 먼저    등록은 늘 beta. manifest는 versions.toml 채널로 서명한다(승격할 수 있는 끝).
#                정식 승격은 사용자가 promote-release.yml을 손으로 실행할 때만.
#
# 같은 소스: prepare가 main 커밋 하나를 고르고 모든 작업이 그 커밋을 빌드한다.
# 덮어쓰기 금지: 릴레이에 같은 버전이 있거나 R2 releases/<version>/ 에 파일이 있으면 멈춘다.
#
# 설정 (GitHub environment, 배포 브랜치 main만):
#   `release`:         secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, RELAY_INTERNAL_SECRET
#                      variables R2_ENDPOINT, R2_BUCKET, R2_PUBLIC_BASE, RELAY_URL
#   `release-signing`: secret UPDATER_SIGNING_KEY (64자리 hex seed, 키 id saba-updater-v1) 하나.
#                      필수 승인자 = 저장소 주인: 서명 작업은 승인해야 돈다 (publish-addons.yml도 같은 환경)
#   Windows 코드 서명(선택, 저장소 수준 설정: windows 작업은 environment 밖에서 돈다):
#              secret SIGNPATH_API_TOKEN, variables SIGNPATH_ORGANIZATION_ID,
#              SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG. 없으면 서명하지 않은 exe로 낸다.
#              산출물 설정: .github/signpath/artifact-configuration.xml
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '빌드·서명까지만 하고 R2 업로드·릴레이 등록은 하지 않는다'
        type: boolean
        default: false
      rollout:
        description: '릴레이 등록 롤아웃 비율 (1~100, 기본 100). 일부만 받게 하고 나중에 릴레이 PATCH로 올린다'
        type: number
        default: 100

permissions:
  contents: read
  actions: read  # SignPath가 아티팩트를 받는다

# 발행은 한 번에 하나. 진행 중인 실행은 취소하지 않는다:
# R2 업로드와 릴레이 등록 사이에서 끊기면 그 버전을 손으로 정리해야 한다
concurrency:
  group: publish
  cancel-in-progress: false

# Windows 러너의 Python 기본 출력 인코딩(cp1252)이 한글·기호에서 멈추지 않게 한다
env:
  PYTHONUTF8: '1'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Check version and relay
    runs-on: ubuntu-22.04
    environment: release
    outputs:
      sha: ${{ steps.src.outputs.sha }}
      version: ${{ steps.src.outputs.version }}
      channel: ${{ steps.src.outputs.channel }}
      binaries: ${{ steps.plan.outputs.binaries }}
      build: ${{ steps.plan.outputs.build }}
      # 공개 주소라 비밀이 아니다: 환경 밖의 관문 작업이 쓴다
      r2_base: ${{ vars.R2_PUBLIC_BASE }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main (got $GITHUB_REF)"; exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Read version
        id: src
        run: |
          python scripts/versions.py check
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('versions.toml','rb'))['release']['version'])")
          CHANNEL=$(python -c "import tomllib;print(tomllib.load(open('versions.toml','rb'))['release'].get('channel','stable'))")
          if [ ! -f "release-notes/$VERSION.json" ]; then
            echo "::error::release-notes/$VERSION.json is missing"; exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "### $VERSION ($CHANNEL) from \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # 40분 빌드 전에 확인한다. 확인하지 못하면 "없다"로 치지 않고 멈춘다
      - name: Refuse an already registered version
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.src.outputs.version }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Saba-Client: 1' \
            "${{ vars.RELAY_URL }}/v1/updates/manifest/$VERSION")
          case "$code" in
            404) ;;
            200) echo "::error::Relay already has $VERSION; bump versions.toml"; exit 1 ;;
            *) echo "::error::Relay check for $VERSION returned HTTP $code"; exit 1 ;;
          esac

      # 지난 릴리즈 = 모든 채널(nightly 이하) 중 yank되지 않은 가장 높은 판. 옛 릴레이(/latest가 없음)면 /check로 찾는다.
      # 읽지 못하면 "처음 릴리즈"로 치지 않고 멈춘다: 안 바뀐 컴포넌트를 새 파일로 다시 내 버리게 된다
      - name: Read the previous release
        run: |
          relay="${{ vars.RELAY_URL }}"
          prev_url=$(curl -fsS -H 'X-Saba-Client: 1' \
            "$relay/v1/updates/latest?channel=nightly&platform=windows-x64&current=0.0.0" \
            | python -c "import json,sys;r=json.load(sys.stdin).get('releases') or [];print(r[0]['manifestUrl'] if r else '')" || true)
          if [ -z "$prev_url" ]; then
            prev_url=$(curl -fsS -H 'X-Saba-Client: 1' \
              "$relay/v1/updates/check?channel=beta&platform=windows-x64&current=0.0.0&client_id=release-workflow" \
              | python -c "import json,sys;print((json.load(sys.stdin).get('latest') or {}).get('manifestUrl',''))")
          fi
          if [ -z "$prev_url" ]; then
            echo "::error::Could not read the previous release manifest from the relay"; exit 1
          fi
          curl -fsS -H 'X-Saba-Client: 1' "$prev_url" > previous-manifest.json

      - name: Plan the partial release
        id: plan
        run: |
          python scripts/versions.py plan --previous previous-manifest.json --out release-plan.json --github-output "$GITHUB_OUTPUT"
          {
            echo "previous: $(python -c "import json;print(json.load(open('previous-manifest.json'))['manifest']['version'])")"
            echo '```json'; cat release-plan.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the previous manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previous-manifest
          path: |
            previous-manifest.json
            release-plan.json
          if-no-files-found: error
          retention-days: 30

  # 실행 파일 컴포넌트(versions.toml `exes`)가 하나라도 바뀌었을 때만 빌드한다. 빌드한 것 중 버전이 안 바뀐 것은
  # manifest에 싣지 않고 지난 항목을 쓴다(versions.py manifest --previous)
  windows:
    name: Build windows-x64
    needs: prepare
    if: needs.prepare.outputs.binaries == 'true'
    runs-on: windows-latest
    # 빌드 약 40분 + SignPath 승인 대기 최대 1시간
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Tauri GUI가 build/를 exe에 넣으므로 cargo보다 먼저 끝나야 한다.
      # 릴리스 빌드는 캐시를 쓰지 않는다: 내보낼 바이너리는 깨끗한 소스에서만 만든다
      - name: Build GUI frontend
        working-directory: saba-chan-gui
        run: |
          npm ci
          npm run build

      - name: Build Rust workspace
        run: cargo build --release --locked --workspace

      # exe 목록은 versions.toml `[components.<키>] exes` 하나에서 읽고, 파일 버전·ProductVersion을 대조한다
      - name: Collect executables
        run: |
          python scripts/versions.py signing --collect target/release --exes dist --out signpath-parameters.txt
          ls -l dist

      - name: Check signing settings
        id: signpath
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          HAS_VARS: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_VARS" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            {
              echo "parameters<<SIGNPATH_EOF"
              cat signpath-parameters.txt
              echo "SIGNPATH_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SignPath is not configured; publishing unsigned executables"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload unsigned executables
        id: unsigned
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: ${{ steps.signpath.outputs.parameters }}
          wait-for-completion: true
          # 릴리스마다 사람이 SignPath에서 승인한다
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Verify signatures
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $bad = Get-ChildItem signed -Filter *.exe | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { Write-Error "Not validly signed: $($bad.Name -join ', ')"; exit 1 }
          if ((Get-ChildItem signed -Filter *.exe).Count -ne (Get-ChildItem dist -Filter *.exe).Count) {
            Write-Error "Signed artifact does not hold every executable"; exit 1
          }
          # 서명은 버전 리소스를 바꾸지 않는다: 한 번 더 대조한다
          python scripts/versions.py signing --exes signed > $null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        env:
          SIGNED: ${{ steps.signpath.outputs.enabled }}
        run: |
          dir=dist
          if [ "$SIGNED" = "true" ]; then dir=signed; fi
          python .github/scripts/package-windows.py --bin "$dir" --out output

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-windows-x64
          path: output/*
          if-no-files-found: error
          retention-days: 7

  # 리눅스 실행 파일은 빌드한 러너의 glibc 판을 요구한다:
  # 문서가 약속한 Ubuntu 22.04·Debian 12에서 돌게 22.04에서 빌드하고 2.35보다 새 기호가 있으면 멈춘다
  linux:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.binaries == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # GUI(Tauri)는 GTK·WebKitGTK 개발 패키지가 든다
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build GUI frontend
        working-directory: saba-chan-gui
        run: |
          npm ci
          npm run build

      - name: Build
        run: |
          cargo build --release --locked -p saba-core -p saba-runner -p saba-chan-cli -p saba-chan-gui -p saba-chan-installer --bins
          # 설치기는 한 번 더 창 없이 빌드한다: 화면 없는 서버(헤드리스 구성)에는 GTK·WebKit이 없다
          cargo build --release --locked -p saba-chan-installer --no-default-features --target-dir target/headless
          for b in target/release/saba-core target/release/saba-runner target/release/saba-chan-cli target/release/saba-chan-installer target/release/saba-chan-gui target/headless/release/saba-chan-installer; do
            need=$(objdump -T "$b" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "$b needs glibc $need"
            if [ "$(printf '%s\n' "$need" 2.35 | sort -V | tail -1)" != "2.35" ]; then
              echo "::error::$b requires glibc $need (> 2.35)"; exit 1
            fi
          done
          python3 .github/scripts/package-linux.py --bin target/release --headless-bin target/headless/release \
            --out output --platform ${{ matrix.platform }}

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-${{ matrix.platform }}
          path: output/*.zip
          if-no-files-found: error
          retention-days: 7

  # 맥(Apple 실리콘): 구성요소 zip은 리눅스와 같은 package-linux.py, 첫 설치용 .dmg는 package-macos.py가 만든다.
  # Apple 서명·공증 없이 임시(ad-hoc) 서명만 한다. 아이콘 원본(.icon)은 Xcode 26 이상의 actool만 컴파일한다
  macos:
    name: Build macos-arm64
    needs: prepare
    if: needs.prepare.outputs.binaries == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build GUI frontend
        working-directory: saba-chan-gui
        run: |
          npm ci
          npm run build

      - name: Build
        run: |
          cargo build --release --locked -p saba-core -p saba-runner -p saba-chan-cli -p saba-chan-gui -p saba-chan-installer --bins
          cargo build --release --locked -p saba-chan-installer --no-default-features --target-dir target/headless

      - name: Select Xcode 26+
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          test -n "$xcode" || { ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # .dmg Finder 창 배치(배경·아이콘 자리)를 Finder 없이 기록한다
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dmgbuild
        run: python -m pip install --quiet dmgbuild==1.6.7

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python .github/scripts/package-linux.py --bin target/release --headless-bin target/headless/release \
            --out output --platform macos-arm64 --version "$VERSION"
          python .github/scripts/package-macos.py --bin target/release --out output --version "$VERSION" --platform macos-arm64
          # .dmg 안: 앱 묶음과 응용 프로그램 바로가기
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" output/Saba-chan-macos-arm64.dmg
          test -d "$RUNNER_TEMP/dmg/Saba-chan.app" && test -L "$RUNNER_TEMP/dmg/Applications"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/Saba-chan.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          ls -l output

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-macos-arm64
          path: |
            output/*.zip
            output/*.dmg
          if-no-files-found: error
          retention-days: 7

  # 조합 관문: 서명할 manifest를 여기서 만들고, 그 조합(이번 빌드 + 지난 릴리즈 파일)으로 E2E를 돌린다.
  # 비밀을 쓰지 않으므로 environment 밖에서 돈다. 통과한 manifest만 sign 작업이 서명한다
  gate:
    name: Build manifest and test the combination
    needs: [prepare, windows, linux, macos]
    # 빌드 작업을 건너뛴 부분 릴리즈(번역만 바뀜 등)도 관문을 거친다
    if: ${{ !cancelled() && needs.prepare.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # 모듈·익스텐션도 같은 릴리스에 싣는다(설치기의 첫 설치용). 둘 다 공개 저장소, main 기준
      - name: Checkout modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WareAoba/saba-chan-modules
          ref: main
          path: addons/modules

      - name: Checkout extensions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WareAoba/saba-chan-extensions
          ref: main
          path: addons/extensions

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Download assets
        if: needs.prepare.outputs.binaries == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          merge-multiple: true
          path: output

      - name: Download the previous manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: previous-manifest

      # 이 작업이 만든 파일(빌드 없이 만든 locales.zip, 모듈·익스텐션 zip)은 gate-output에도 두어 publish가 같은 바이트를 올린다
      - name: Build manifest
        run: |
          mkdir -p output gate-output
          if [ ! -f output/locales.zip ]; then
            python .github/scripts/package-windows.py --locales-only --out gate-output
            cp gate-output/locales.zip output/
          fi
          python scripts/versions.py manifest --assets output \
            --base-url "${{ needs.prepare.outputs.r2_base }}" --platform windows-x64 --also-platform linux-x64 --also-platform linux-arm64 --also-platform macos-arm64 \
            --modules-repo addons/modules --extensions-repo addons/extensions \
            --addons-ref "$(git -C addons/modules rev-parse HEAD)" \
            --previous previous-manifest.json \
            --out release-manifest.unsigned.json
          cp output/module-*.zip output/ext-*.zip gate-output/ 2>/dev/null || true
          # 맥 웹사이트 다운로드(릴레이가 installer.dmg로 보낸다)가 빠진 채 나가지 않게 한다
          python -c "import json,sys;m=json.load(open('release-manifest.unsigned.json'));sys.exit(0 if 'installer.dmg' in m['platforms']['macos-arm64']['components'] else 'macos-arm64: no installer.dmg in the manifest')"
          cat release-manifest.unsigned.json

      # 지난 릴리즈 파일은 R2 공개 주소에서 받아 manifest의 sha256과 대조한다
      - name: Assemble the linux-x64 combination
        run: |
          python scripts/versions.py assemble --manifest release-manifest.unsigned.json --platform linux-x64 \
            --assets output --keys saba-core cli --out combo
          python - <<'PY'
          import os, zipfile
          for name in sorted(os.listdir("combo")):
              with zipfile.ZipFile(os.path.join("combo", name)) as zf:
                  zf.extractall("combo/bin")
          PY
          chmod +x combo/bin/saba-core combo/bin/saba-runner combo/bin/saba-chan-cli
          ls -l combo/bin

      # 선언하지 않은 능력을 쓰는 모듈·익스텐션은 싣지 않는다. 이 조합의 linux-x64 데몬으로 본다
      - name: Audit modules and extensions
        run: |
          mods=$(for d in addons/modules/*/; do [ -f "$d/module.toml" ] && echo "$d"; done)
          exts=$(for d in addons/extensions/*/; do [ -f "$d/manifest.json" ] && echo "$d"; done)
          ./combo/bin/saba-core module audit $mods
          ./combo/bin/saba-core extension audit $exts

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # 업데이터의 릴레이 경로(확인 → 서명 검증 → 내려받기 → 적용)
      - name: Updater E2E
        run: cargo test --locked --test updater_relay_e2e --test updater_integration

      # 실제 데몬·러너·CLI를 띄우는 E2E를 이 조합의 실행 파일로 (외부망·SteamCMD·느린 시험 제외)
      - name: Combination E2E
        env:
          SABA_E2E_ROOT: ${{ runner.temp }}/saba-e2e
          SABA_E2E_BIN_DIR: ${{ github.workspace }}/combo/bin
          SABA_E2E_MODULES_REPO: ${{ github.workspace }}/addons/modules
          SABA_E2E_EXTENSIONS_REPO: ${{ github.workspace }}/addons/extensions
        run: bash tests/e2e/run-cloud.sh

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-e2e-report
          path: ${{ runner.temp }}/saba-e2e/*.md
          if-no-files-found: ignore

      - name: Keep the gated manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-unsigned
          path: |
            release-manifest.unsigned.json
            previous-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Keep files made here
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-gate
          path: gate-output/*
          if-no-files-found: ignore
          retention-days: 7

  # 서명: 키는 environment `release-signing`(필수 승인자 = 저장소 주인)에만 있다. 관문을 통과한 manifest만 서명한다
  sign:
    name: Sign manifest
    needs: [prepare, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: ubuntu-22.04
    environment: release-signing
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # 서명 도구는 키 없이 먼저 빌드한다: 의존성 빌드 스크립트가 키를 환경에서 읽지 못하게
      - name: Build signing tool
        run: cargo build --quiet --locked -p saba-chan-updater-lib --example release_signing

      - name: Download the gated manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest-unsigned

      # 지난 릴리즈 항목(url·sha256)을 그대로 서명하므로, 그 manifest가 번들 공개키로 검증되는지 먼저 본다
      - name: Sign
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          ./target/debug/examples/release_signing verify previous-manifest.json
          # 번들된 공개키로 검증까지 통과해야 출력된다
          ./target/debug/examples/release_signing \
            sign release-manifest.unsigned.json saba-updater-v1 > release-manifest.signed.json
          # 등록은 늘 베타 먼저. 정식은 promote-release.yml로 사용자가 올린다
          python scripts/versions.py registration --signed release-manifest.signed.json \
            --channel beta --rollout "$ROLLOUT" --out release-registration.json

      - name: Keep manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: |
            release-manifest.unsigned.json
            release-manifest.signed.json
            release-registration.json
          retention-days: 30

  publish:
    name: Upload to R2, register on beta
    needs: [prepare, sign]
    if: ${{ !cancelled() && needs.sign.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-22.04
    environment: release
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Download assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          merge-multiple: true
          path: output

      - name: Download manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest

      - name: Refuse to overwrite R2 or the relay
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Saba-Client: 1' \
            "${{ vars.RELAY_URL }}/v1/updates/manifest/$VERSION")
          if [ "$code" != "404" ]; then
            echo "::error::Relay check for $VERSION returned HTTP $code (expected 404)"; exit 1
          fi
          count=$(aws s3api list-objects-v2 --bucket "${{ vars.R2_BUCKET }}" \
            --prefix "releases/$VERSION/" --max-keys 1 --query 'KeyCount' --output text \
            --endpoint-url "${{ vars.R2_ENDPOINT }}")
          if [ "$count" != "0" ]; then
            echo "::error::R2 releases/$VERSION/ already has objects (KeyCount=$count)"; exit 1
          fi
          # 부분 릴리즈가 가리키는 지난 릴리즈 파일이 R2에 남아 있어야 한다
          python scripts/versions.py uploads --registration release-registration.json --reused > r2-reused.txt
          while read -r file key; do
            aws s3api head-object --bucket "${{ vars.R2_BUCKET }}" --key "$key" \
              --endpoint-url "${{ vars.R2_ENDPOINT }}" > /dev/null \
              || { echo "::error::R2 $key (reused $file) is missing"; exit 1; }
          done < r2-reused.txt

      - name: Upload assets to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # 이번 릴리즈 자리(releases/<version>/)의 파일만 올린다. 그대로 쓰는 지난 파일은 이미 있다
          python scripts/versions.py uploads --registration release-registration.json > r2-uploads.txt
          while read -r file key; do
            echo "  $file -> $key"
            aws s3 cp "output/$file" "s3://${{ vars.R2_BUCKET }}/$key" \
              --endpoint-url "${{ vars.R2_ENDPOINT }}" --no-progress
          done < r2-uploads.txt

      - name: Register release with relay
        env:
          RELAY_INTERNAL_SECRET: ${{ secrets.RELAY_INTERNAL_SECRET }}
        run: |
          curl -fsS -X POST "${{ vars.RELAY_URL }}/admin/releases" \
            -H "x-internal-secret: $RELAY_INTERNAL_SECRET" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @release-registration.json > /dev/null
          curl -fsS -H 'X-Saba-Client: 1' "${{ vars.RELAY_URL }}/v1/updates/manifest/$VERSION" > /dev/null
          echo "### Registered $VERSION on beta (signed for ${{ needs.prepare.outputs.channel }}; promote with promote-release.yml)" >> "$GITHUB_STEP_SUMMARY"

  # 앱은 GitHub를 보지 않는다. 공개 기록용으로 R2와 같은 파일을 올린다
  github-release:
    name: GitHub release
    needs: [prepare, publish]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      sha: ${{ needs.prepare.outputs.sha }}
