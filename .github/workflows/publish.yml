name: Publish release

# ─────────────────────────────────────────────────────────
# 클라이언트 릴리스 발행: 빌드 → 패키징 → manifest 서명 → R2 업로드 → 릴레이 등록
#
# 사용법: Actions 탭에서 이 워크플로를 main으로 실행한다. 버전·채널은 versions.toml [release],
# 패치노트는 release-notes/<version>.json 에서 읽는다. 등록이 끝나면 github-release.yml이
# 같은 파일로 GitHub Release(태그 v<version>, stable이 아니면 사전 릴리스)를 만든다.
#   dry_run = true 이면 빌드·패키징·서명까지만 하고 R2·릴레이는 건드리지 않는다
#   (결과물은 실행의 아티팩트로 남는다).
#
# 같은 소스: prepare가 main 커밋 하나를 고르고 모든 작업이 그 커밋을 빌드한다.
# 덮어쓰기 금지: 릴레이에 같은 버전이 있거나 R2 releases/<version>/ 에 파일이 있으면 멈춘다.
#
# 설정 (GitHub environment `release`, 배포 브랜치 main만):
#   secrets:   UPDATER_SIGNING_KEY (64자리 hex seed, 키 id saba-updater-v1),
#              R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, RELAY_INTERNAL_SECRET
#   variables: R2_ENDPOINT, R2_BUCKET, R2_PUBLIC_BASE, RELAY_URL
#   Windows 코드 서명(선택, 저장소 수준 설정: windows 작업은 environment 밖에서 돈다):
#              secret SIGNPATH_API_TOKEN, variables SIGNPATH_ORGANIZATION_ID,
#              SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG. 없으면 서명하지 않은 exe로 낸다.
#              산출물 설정: .github/signpath/artifact-configuration.xml
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '빌드·서명까지만 하고 R2 업로드·릴레이 등록은 하지 않는다'
        type: boolean
        default: false
      rollout:
        description: '릴레이 등록 롤아웃 비율 (1~100, 기본 100). 일부만 받게 하고 나중에 릴레이 PATCH로 올린다'
        type: number
        default: 100

permissions:
  contents: read
  actions: read  # SignPath가 아티팩트를 받는다

# 발행은 한 번에 하나. 진행 중인 실행은 취소하지 않는다:
# R2 업로드와 릴레이 등록 사이에서 끊기면 그 버전을 손으로 정리해야 한다
concurrency:
  group: publish
  cancel-in-progress: false

# Windows 러너의 Python 기본 출력 인코딩(cp1252)이 한글·기호에서 멈추지 않게 한다
env:
  PYTHONUTF8: '1'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Check version and relay
    runs-on: ubuntu-22.04
    environment: release
    outputs:
      sha: ${{ steps.src.outputs.sha }}
      version: ${{ steps.src.outputs.version }}
      channel: ${{ steps.src.outputs.channel }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main (got $GITHUB_REF)"; exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Read version
        id: src
        run: |
          python scripts/versions.py check
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('versions.toml','rb'))['release']['version'])")
          CHANNEL=$(python -c "import tomllib;print(tomllib.load(open('versions.toml','rb'))['release'].get('channel','stable'))")
          if [ ! -f "release-notes/$VERSION.json" ]; then
            echo "::error::release-notes/$VERSION.json is missing"; exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "### $VERSION ($CHANNEL) from \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # 40분 빌드 전에 확인한다. 확인하지 못하면 "없다"로 치지 않고 멈춘다
      - name: Refuse an already registered version
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.src.outputs.version }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Saba-Client: 1' \
            "${{ vars.RELAY_URL }}/v1/updates/manifest/$VERSION")
          case "$code" in
            404) ;;
            200) echo "::error::Relay already has $VERSION; bump versions.toml"; exit 1 ;;
            *) echo "::error::Relay check for $VERSION returned HTTP $code"; exit 1 ;;
          esac

  windows:
    name: Build windows-x64
    needs: prepare
    runs-on: windows-latest
    # 빌드 약 40분 + SignPath 승인 대기 최대 1시간
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Tauri GUI가 build/를 exe에 넣으므로 cargo보다 먼저 끝나야 한다.
      # 릴리스 빌드는 캐시를 쓰지 않는다: 내보낼 바이너리는 깨끗한 소스에서만 만든다
      - name: Build GUI frontend
        working-directory: saba-chan-gui
        run: |
          npm ci
          npm run build

      - name: Build Rust workspace
        run: cargo build --release --locked --workspace

      # exe 목록은 versions.toml `[components.<키>] exes` 하나에서 읽고, 파일 버전·ProductVersion을 대조한다
      - name: Collect executables
        run: |
          python scripts/versions.py signing --collect target/release --exes dist --out signpath-parameters.txt
          ls -l dist

      - name: Check signing settings
        id: signpath
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          HAS_VARS: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_VARS" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            {
              echo "parameters<<SIGNPATH_EOF"
              cat signpath-parameters.txt
              echo "SIGNPATH_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SignPath is not configured; publishing unsigned executables"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload unsigned executables
        id: unsigned
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: ${{ steps.signpath.outputs.parameters }}
          wait-for-completion: true
          # 릴리스마다 사람이 SignPath에서 승인한다
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Verify signatures
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $bad = Get-ChildItem signed -Filter *.exe | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { Write-Error "Not validly signed: $($bad.Name -join ', ')"; exit 1 }
          if ((Get-ChildItem signed -Filter *.exe).Count -ne (Get-ChildItem dist -Filter *.exe).Count) {
            Write-Error "Signed artifact does not hold every executable"; exit 1
          }
          # 서명은 버전 리소스를 바꾸지 않는다: 한 번 더 대조한다
          python scripts/versions.py signing --exes signed > $null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        env:
          SIGNED: ${{ steps.signpath.outputs.enabled }}
        run: |
          dir=dist
          if [ "$SIGNED" = "true" ]; then dir=signed; fi
          python .github/scripts/package-windows.py --bin "$dir" --out output

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-windows-x64
          path: output/*
          if-no-files-found: error
          retention-days: 7

  # 리눅스 실행 파일은 빌드한 러너의 glibc 판을 요구한다:
  # 문서가 약속한 Ubuntu 22.04·Debian 12에서 돌게 22.04에서 빌드하고 2.35보다 새 기호가 있으면 멈춘다
  linux:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # GUI(Tauri)는 GTK·WebKitGTK 개발 패키지가 든다
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build GUI frontend
        working-directory: saba-chan-gui
        run: |
          npm ci
          npm run build

      - name: Build
        run: |
          cargo build --release --locked -p saba-core -p saba-runner -p saba-chan-cli -p saba-chan-gui -p saba-chan-installer --bins
          # 설치기는 한 번 더 창 없이 빌드한다: 화면 없는 서버(헤드리스 구성)에는 GTK·WebKit이 없다
          cargo build --release --locked -p saba-chan-installer --no-default-features --target-dir target/headless
          for b in target/release/saba-core target/release/saba-runner target/release/saba-chan-cli target/release/saba-chan-installer target/release/saba-chan-gui target/headless/release/saba-chan-installer; do
            need=$(objdump -T "$b" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "$b needs glibc $need"
            if [ "$(printf '%s\n' "$need" 2.35 | sort -V | tail -1)" != "2.35" ]; then
              echo "::error::$b requires glibc $need (> 2.35)"; exit 1
            fi
          done
          python3 .github/scripts/package-linux.py --bin target/release --headless-bin target/headless/release \
            --out output --platform ${{ matrix.platform }}

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-${{ matrix.platform }}
          path: output/*.zip
          if-no-files-found: error
          retention-days: 7

  # 맥(Apple 실리콘): 구성요소 zip은 리눅스와 같은 package-linux.py, 첫 설치용 .dmg는 package-macos.py가 만든다.
  # Apple 서명·공증 없이 임시(ad-hoc) 서명만 한다. 아이콘 원본(.icon)은 Xcode 26 이상의 actool만 컴파일한다
  macos:
    name: Build macos-arm64
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build GUI frontend
        working-directory: saba-chan-gui
        run: |
          npm ci
          npm run build

      - name: Build
        run: |
          cargo build --release --locked -p saba-core -p saba-runner -p saba-chan-cli -p saba-chan-gui -p saba-chan-installer --bins
          cargo build --release --locked -p saba-chan-installer --no-default-features --target-dir target/headless

      - name: Select Xcode 26+
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          test -n "$xcode" || { ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # .dmg Finder 창 배치(배경·아이콘 자리)를 Finder 없이 기록한다
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dmgbuild
        run: python -m pip install --quiet dmgbuild==1.6.7

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python .github/scripts/package-linux.py --bin target/release --headless-bin target/headless/release \
            --out output --platform macos-arm64 --version "$VERSION"
          python .github/scripts/package-macos.py --bin target/release --out output --version "$VERSION" --platform macos-arm64
          # .dmg 안: 앱 묶음과 응용 프로그램 바로가기
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" output/Saba-chan-macos-arm64.dmg
          test -d "$RUNNER_TEMP/dmg/Saba-chan.app" && test -L "$RUNNER_TEMP/dmg/Applications"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/Saba-chan.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          ls -l output

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-macos-arm64
          path: |
            output/*.zip
            output/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign manifest, upload to R2, register
    needs: [prepare, windows, linux, macos]
    runs-on: ubuntu-22.04
    environment: release
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # 모듈·익스텐션도 같은 릴리스에 싣는다. 둘 다 공개 저장소, main 기준
      - name: Checkout modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WareAoba/saba-chan-modules
          ref: main
          path: addons/modules

      - name: Checkout extensions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WareAoba/saba-chan-extensions
          ref: main
          path: addons/extensions

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Download assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          merge-multiple: true
          path: output

      # 선언하지 않은 능력을 쓰는 모듈·익스텐션은 싣지 않는다. 방금 빌드한 linux-x64 데몬으로 본다
      - name: Audit modules and extensions
        run: |
          mkdir -p tools
          python -c "import zipfile;zipfile.ZipFile('output/saba-core-linux-x64.zip').extract('saba-core','tools')"
          chmod +x tools/saba-core
          mods=$(for d in addons/modules/*/; do [ -f "$d/module.toml" ] && echo "$d"; done)
          exts=$(for d in addons/extensions/*/; do [ -f "$d/manifest.json" ] && echo "$d"; done)
          ./tools/saba-core module audit $mods
          ./tools/saba-core extension audit $exts

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # 서명 도구는 키 없이 먼저 빌드한다: 의존성 빌드 스크립트가 키를 환경에서 읽지 못하게
      - name: Build signing tool
        run: cargo build --quiet --locked -p saba-chan-updater-lib --example release_signing

      - name: Build and sign manifest
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          # 지난 릴리스(모든 채널 중 최신)의 manifest: 바뀐 모듈·익스텐션이 같은 버전으로 다시 나가지 않게 대조한다
          prev_url=$(curl -fsS -H 'X-Saba-Client: 1' \
            "${{ vars.RELAY_URL }}/v1/updates/check?channel=beta&platform=windows-x64&current=0.0.0&client_id=release-workflow" \
            | python -c "import json,sys;print(json.load(sys.stdin).get('latest',{}).get('manifestUrl',''))")
          if [ -z "$prev_url" ]; then
            echo "::error::Could not read the previous release manifest from the relay"; exit 1
          fi
          curl -fsS -H 'X-Saba-Client: 1' "$prev_url" > previous-manifest.json
          python scripts/versions.py manifest --assets output \
            --base-url "${{ vars.R2_PUBLIC_BASE }}" --platform windows-x64 --also-platform linux-x64 --also-platform linux-arm64 --also-platform macos-arm64 \
            --modules-repo addons/modules --extensions-repo addons/extensions \
            --addons-ref "$(git -C addons/modules rev-parse HEAD)" \
            --previous previous-manifest.json \
            --out release-manifest.unsigned.json
          # 번들된 공개키로 검증까지 통과해야 출력된다
          # 맥 웹사이트 다운로드(릴레이가 installer.dmg로 보낸다)가 빠진 채 나가지 않게 한다
          python -c "import json,sys;m=json.load(open('release-manifest.unsigned.json'));sys.exit(0 if 'installer.dmg' in m['platforms']['macos-arm64']['components'] else 'macos-arm64: no installer.dmg in the manifest')"
          ./target/debug/examples/release_signing \
            sign release-manifest.unsigned.json saba-updater-v1 > release-manifest.signed.json
          python scripts/versions.py registration --signed release-manifest.signed.json \
            --rollout "$ROLLOUT" --out release-registration.json
          cat release-manifest.unsigned.json

      - name: Keep manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: |
            release-manifest.unsigned.json
            release-manifest.signed.json
            release-registration.json
          retention-days: 30

      - name: Refuse to overwrite R2 or the relay
        if: env.DRY_RUN != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Saba-Client: 1' \
            "${{ vars.RELAY_URL }}/v1/updates/manifest/$VERSION")
          if [ "$code" != "404" ]; then
            echo "::error::Relay check for $VERSION returned HTTP $code (expected 404)"; exit 1
          fi
          count=$(aws s3api list-objects-v2 --bucket "${{ vars.R2_BUCKET }}" \
            --prefix "releases/$VERSION/" --max-keys 1 --query 'KeyCount' --output text \
            --endpoint-url "${{ vars.R2_ENDPOINT }}")
          if [ "$count" != "0" ]; then
            echo "::error::R2 releases/$VERSION/ already has objects (KeyCount=$count)"; exit 1
          fi

      - name: Upload assets to R2
        if: env.DRY_RUN != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          python - <<'PY' > r2-uploads.txt
          import json
          m = json.load(open("release-registration.json"))
          # 모듈·locales는 플랫폼마다 한 줄씩 등록되지만 같은 파일이다: 한 번만 올린다
          for filename, key in sorted({(a["filename"], a["r2Key"]) for a in m["assets"]}):
              print(filename, key)
          PY
          while read -r file key; do
            echo "  $file -> $key"
            aws s3 cp "output/$file" "s3://${{ vars.R2_BUCKET }}/$key" \
              --endpoint-url "${{ vars.R2_ENDPOINT }}" --no-progress
          done < r2-uploads.txt

      - name: Register release with relay
        if: env.DRY_RUN != 'true'
        env:
          RELAY_INTERNAL_SECRET: ${{ secrets.RELAY_INTERNAL_SECRET }}
        run: |
          curl -fsS -X POST "${{ vars.RELAY_URL }}/admin/releases" \
            -H "x-internal-secret: $RELAY_INTERNAL_SECRET" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @release-registration.json > /dev/null
          curl -fsS -H 'X-Saba-Client: 1' "${{ vars.RELAY_URL }}/v1/updates/manifest/$VERSION" > /dev/null
          echo "### Registered $VERSION (${{ needs.prepare.outputs.channel }})" >> "$GITHUB_STEP_SUMMARY"

  # 앱은 GitHub를 보지 않는다. 공개 기록용으로 R2와 같은 파일을 올린다
  github-release:
    name: GitHub release
    needs: [prepare, publish]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      sha: ${{ needs.prepare.outputs.sha }}
