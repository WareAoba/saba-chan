[package]
name = "saba-chan-gui"
version = "0.1.14"
edition = "2024"
authors = ["WareAoba"]
description = "Saba-chan desktop interface (Tauri shell)"

[lints]
workspace = true

[lib]
name = "saba_chan_gui_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "saba-chan-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hmac = "0.13"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
# 투명 창(트레이 팝업)은 맥에서 이 기능이 있어야 한다 (tauri.conf.json app.macOSPrivateApi와 짝)
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "system-proxy", "stream"] }
futures-util = "0.3"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"
# gtk: Linux 창 바탕 흐림 요청 (window_backdrop)
saba-chan-updater-lib = { path = "../../updater", features = ["gtk"] }

[target.'cfg(target_os = "linux")'.dependencies]
# 창 바탕 반투명: GTK 창에서 X11 창을 얻는다 (Tauri가 쓰는 판과 같다)
gtk = "0.18"

# 효과음: 앱 안에서 재생한다 (Windows는 PlaySound). 리눅스는 ALSA(libasound2-dev)로 빌드한다
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "tracing"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 알림: UserNotifications (알림 플러그인의 맥 구현은 폐기된 NSUserNotificationCenter를 쓴다)
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
# 바탕화면 오버레이 창을 NSPanel로: 눌러도 앱이 앞으로 오지 않고, 모든 데스크톱과 전체 화면 앱 위에 보인다
tauri-nspanel = "2.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# 알림 플러그인과 같은 토스트 구현. 결과를 받아 기록하려고 직접 부른다
tauri-winrt-notification = "0.8"
# 효과음 (PlaySound, 실행 파일에 실은 wav)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio"] }

[dev-dependencies]
tempfile = "3.8"

[features]
# 배포 빌드는 build/를 exe에 싣는다. 개발 실행은 --no-default-features (vite devUrl)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
