[package]
name = "saba-chan-gui"
version = "0.1.12-beta.2"
edition = "2021"
authors = ["WareAoba"]
description = "Saba-chan desktop interface (Tauri shell)"

[lib]
name = "saba_chan_gui_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "saba-chan-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hmac = "0.13"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
# 투명 창(트레이 팝업)은 맥에서 이 기능이 있어야 한다 (tauri.conf.json app.macOSPrivateApi와 짝)
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "system-proxy", "stream"] }
futures-util = "0.3"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"
saba-chan-updater-lib = { path = "../../updater" }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# 알림 플러그인과 같은 토스트 구현. 결과를 받아 기록하려고 직접 부른다
tauri-winrt-notification = "0.8"
# 효과음 (PlaySound, 실행 파일에 실은 wav)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio"] }

[dev-dependencies]
tempfile = "3.8"

[features]
# 배포 빌드는 build/를 exe에 싣는다. 개발 실행은 --no-default-features (vite devUrl)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
