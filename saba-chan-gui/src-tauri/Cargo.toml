[package]
name = "saba-chan-gui"
version = "0.1.5"
edition = "2021"
authors = ["WareAoba"]
description = "Saba-chan desktop interface (Tauri shell)"

[lib]
name = "saba_chan_gui_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "saba-chan-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
base64 = "0.21"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"
saba-chan-updater-lib = { path = "../../updater" }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3.8"

[features]
# 배포 빌드는 build/를 exe에 싣는다. 개발 실행은 --no-default-features (vite devUrl)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
