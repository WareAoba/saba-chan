[package]
name = "saba-atomic-file"
version = "0.1.8"
edition = "2021"
authors = ["WareAoba"]
description = "Whole-file replace through a temp file, shared by every saba-chan crate"
repository = "https://github.com/WareAoba/saba-chan"
license = "MIT"

[lib]
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.8"
