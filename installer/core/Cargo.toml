[package]
name = "saba-chan-installer-core"
version = "0.1.11"
edition = "2021"
authors = ["WareAoba"]
description = "Saba-chan install/uninstall engine shared by the installer GUI and saba-chan-cli install"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "system-proxy", "stream"] }
sys-locale = "0.3"
saba-chan-updater-lib = { path = "../../updater" }
futures-util = "0.3"
toml = "0.9"
dirs = "6"

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate", "time"] }
tempfile = "3.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
] }
winreg = "0.52"

[features]
# 개발용: 모의 릴레이의 고정 키를 믿고 `SABA_RELAY_URL`을 따른다 (scripts/mock-release-server.js). 릴리즈 빌드에는 켜지 않는다
mock-relay = ["saba-chan-updater-lib/mock-relay"]
