[package]
name = "saba-chan-installer-core"
version = "0.1.10"
edition = "2021"
authors = ["WareAoba"]
description = "Saba-chan install/uninstall engine shared by the installer GUI and saba-chan-cli install"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "system-proxy", "stream"] }
sys-locale = "0.3"
saba-chan-updater-lib = { path = "../../updater" }
futures-util = "0.3"
toml = "0.8"
dirs = "5"

[dev-dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate", "time"] }
tempfile = "3.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
] }
winreg = "0.52"
