<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saba-chan Updater</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="updater.css" />
</head>
<body>
<div class="win">
    <!-- 상단 바 -->
    <header class="appbar" data-tauri-drag-region>
        <span class="mode" id="mode-chip" data-tauri-drag-region>Update</span>
        <span class="sp" data-tauri-drag-region></span>
        <span class="winbtns">
            <button class="win-btn" id="btn-minimize" type="button" title="Minimize"><svg viewBox="0 0 12 12"><line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="1.3"/></svg></button>
            <button class="win-btn win-close" id="btn-close" type="button" title="Close" hidden><svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.3"/></svg></button>
        </span>
    </header>

    <!-- 본문: 그림(빛이 훑음) → 접히며 매트릭스(적용 중) → 성공·실패 -->
    <main class="body flow u" id="flow" data-step="start">
        <div class="f-mat">
            <div class="matrix" id="matrix" aria-hidden="true"><canvas></canvas></div>
            <div class="vign"></div>
            <div class="center f-run">
                <div class="ring spin" id="progress-ring"><i class="g2"></i><i class="g1"></i><i class="m"></i><img src="title.png" alt="" /></div>
                <div class="wordmark" role="img" aria-label="Saba-chan"></div>
                <div class="h-title" id="ring-title">Updating...</div>
                <div class="h-sub" id="ring-sub">Please wait...</div>
                <div class="later" id="fail-wrap"><span class="chip stop" id="fail-summary" hidden></span></div>
            </div>
        </div>

        <div class="f-art" aria-hidden="true"><img src="saba-hooked-wide.webp" alt="" /><i class="f-shine"></i></div>
        <i class="f-edge" aria-hidden="true"></i>

        <!-- 진행 줄: 처음부터 -->
        <div class="strip f-strip" id="progress-bar">
            <div class="l">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                <span class="msg" id="progress-message">Loading...</span>
                <span class="pct" id="progress-percent"></span>
            </div>
            <div class="track"><div class="fill" id="progress-fill"></div></div>
        </div>

        <!-- 실패: 진행 줄 자리에 [닫기] -->
        <div class="footer f-foot">
            <span class="sp"></span>
            <button class="btn ghost" id="btn-close-failed" type="button"><span id="btn-close-failed-text">Close</span></button>
        </div>
    </main>
</div>

<script src="translations.js"></script>
<script src="common.js"></script>
<script src="updater.js"></script>
</body>
</html>
