<title id="t">How Saba-chan fits together</title>
<desc id="d">The GUI and CLI drive the daemon through an HTTP API on this PC. The daemon starts game servers and calls modules and extensions in Python. Discord commands go through the cloud relay, and the PC opens that connection itself.</desc>
