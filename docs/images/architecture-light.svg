<title id="t">사바쨩 구조</title>
<desc id="d">GUI와 CLI는 이 PC 안의 HTTP API로 데몬을 조작합니다. 데몬은 게임 서버를 실행하고 모듈과 익스텐션을 Python으로 부릅니다. 디스코드 명령은 클라우드 릴레이를 거치고, 연결은 PC가 먼저 바깥으로 엽니다.</desc>
